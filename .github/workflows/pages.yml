name: Cập nhật dữ liệu và GitHub Pages

on:
  schedule:
    - cron: "0 2,8 * * *"   # 9h và 15h giờ Việt Nam
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATA_DIR: ${{ github.workspace }}/state
    steps:
      - uses: actions/checkout@v4

      - name: Khôi phục cơ sở dữ liệu từ nhánh data
        run: |
          mkdir -p state
          if git fetch --depth 1 origin data; then git show FETCH_HEAD:prices.db > state/prices.db; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lấy dữ liệu
        run: python -m app.ingest

      - name: Tính dự báo
        run: python -m app.model

      - name: Xuất web tĩnh
        run: python -m app.export_static _site

      - name: Lưu cơ sở dữ liệu vào nhánh data
        run: |
          cd state
          git init -q -b data
          git add prices.db
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Dữ liệu $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
